name: Build Clash Of Verse APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.4.1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Find Godot project (or extract zip)
        run: |
          if [ -f project.godot ]; then
            DIR="$GITHUB_WORKSPACE"
          else
            PG=$(find . -name project.godot -not -path "./.git/*" -not -path "*/.godot/*" | head -1)
            if [ -z "$PG" ]; then
              ZIP=$(find . -iname "*.zip" -not -path "./.git/*" | sort -V | tail -1)
              [ -z "$ZIP" ] && { echo "ERROR: project.godot and zip not found"; exit 1; }
              echo "Using zip: $ZIP"
              mkdir -p src_unzipped
              unzip -q "$ZIP" -d src_unzipped || true
              rm -rf src_unzipped/__MACOSX
              PG=$(find src_unzipped -name project.godot | head -1)
              [ -z "$PG" ] && { echo "ERROR: project.godot not found in zip"; exit 1; }
            fi
            DIR="$(cd "$(dirname "$PG")" && pwd)"
          fi
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
          echo "Project dir: $DIR"
          ls -la "$DIR"
          [ -f "$DIR/export_presets.cfg" ] || { echo "ERROR: export_presets.cfg missing"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK components
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          ls "$SDKM" || { echo "ERROR: sdkmanager not found"; exit 1; }
          yes | "$SDKM" --licenses > /dev/null || true
          yes | "$SDKM" "platform-tools" "build-tools;35.0.1" "platforms;android-35" \
            "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;28.1.13356709" | grep -v "^\[" || true
          echo "--- SDK contents ---"
          ls "$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools"
          ls "$ANDROID_HOME/platforms"
          [ -x "$ANDROID_HOME/build-tools/35.0.1/apksigner" ] || { echo "ERROR: build-tools 35.0.1 missing"; exit 1; }
          [ -d "$ANDROID_HOME/platform-tools" ] || { echo "ERROR: platform-tools missing"; exit 1; }
          echo "ANDROID_SDK=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Cache Godot download
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-dl
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot + export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-dl && cd ~/godot-dl
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"

      - name: Install Godot
        run: |
          cd ~/godot-dl
          unzip -q -o godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          TPL=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$TPL"
          rm -rf tpl && unzip -q -o templates.tpz -d tpl
          mv tpl/templates/* "$TPL"/
          echo "--- templates in $TPL ---"
          ls -la "$TPL" | grep -i android
          [ -f "$TPL/android_release.apk" ] || { echo "ERROR: android_release.apk template missing"; exit 1; }
          godot --version

      - name: Create debug keystore + configure Godot editor settings
        run: |
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" > /dev/null
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres editor_settings-4.4.tres; do
            cat > ~/.config/godot/$f <<EOS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOS
          done
          echo "--- editor settings ---"
          cat ~/.config/godot/editor_settings-4.4.tres
          echo "JAVA_HOME=$JAVA_HOME"
          ls "$JAVA_HOME/bin/java"

      - name: Patch project settings for Android (ETC2/ASTC + icon)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          import re
          s = open("project.godot", encoding="utf-8").read()
          def put(section, key, val):
              global s
              line = f"{key}={val}"
              m = re.search(r"(?ms)^\[%s\]\n(.*?)(?=^\[|\Z)" % re.escape(section), s)
              if not m:
                  s = s.rstrip("\n") + f"\n\n[{section}]\n\n{line}\n"
                  return
              body = m.group(1)
              if re.search(r"(?m)^%s=" % re.escape(key), body):
                  new = re.sub(r"(?m)^%s=.*$" % re.escape(key), lambda _: line, body)
              else:
                  new = body.rstrip("\n") + "\n" + line + "\n\n"
              s = s[:m.start(1)] + new + s[m.end(1):]
          put("rendering", "textures/vram_compression/import_etc2_astc", "true")
          put("application", "config/icon", '"res://assets/clash_of_verse_splash.png"')
          open("project.godot", "w", encoding="utf-8").write(s)
          PY
          echo "--- project.godot ---"
          cat project.godot
          rm -rf .godot

      - name: Prepare signing key + patch export preset
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            PASS="$KS_PASS"; ALIAS="$KS_ALIAS"
            echo "Using keystore from secrets"
          else
            PASS="android123"; ALIAS="temp"
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=ClashOfVerse"
            echo "Using temporary keystore"
          fi
          export KS_PATH="$RUNNER_TEMP/release.jks" KS_USER="$ALIAS" KS_PW="$PASS"
          cd "$PROJECT_DIR"
          python3 - <<'PY'
          import re, os
          run = os.environ["RUN_NUMBER"]
          vals = {
              "version/code": run,
              "version/name": '"0.1.%s"' % run,
              "keystore/release": '"%s"' % os.environ["KS_PATH"],
              "keystore/release_user": '"%s"' % os.environ["KS_USER"],
              "keystore/release_password": '"%s"' % os.environ["KS_PW"],
              "package/signed": "true",
          }
          s = open("export_presets.cfg", encoding="utf-8").read()
          for k, v in vals.items():
              line = "%s=%s" % (k, v)
              if re.search(r"(?m)^" + re.escape(k) + r"=", s):
                  s = re.sub(r"(?m)^" + re.escape(k) + r"=.*$", lambda m: line, s)
              else:
                  s = s.replace("[preset.0.options]\n", "[preset.0.options]\n" + line + "\n")
          open("export_presets.cfg", "w", encoding="utf-8").write(s)
          PY
          echo "--- export_presets.cfg (without passwords) ---"
          grep -v "password" export_presets.cfg

      - name: Import project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          godot --headless --import || true
          godot --headless --import || true

      - name: Export APK (release, fallback to debug)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p build
          echo "=== RELEASE EXPORT ==="
          godot --headless --export-release "Android" build/ClashOfVerse.apk 2>&1 | grep -v "^Loading resource" || true
          if [ ! -s build/ClashOfVerse.apk ]; then
            echo "=== RELEASE FAILED, TRYING DEBUG EXPORT ==="
            godot --headless --export-debug "Android" build/ClashOfVerse.apk 2>&1 | grep -v "^Loading resource" || true
          fi
          [ -s build/ClashOfVerse.apk ] || { echo "ERROR: APK was not created"; exit 1; }
          ls -la build

      - name: Verify APK signature
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.1"
          "$BT/apksigner" verify --verbose build/ClashOfVerse.apk
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp build/ClashOfVerse.apk "$GITHUB_WORKSPACE/dist/ClashOfVerse.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ClashOfVerse-APK
          path: dist/ClashOfVerse.apk
          if-no-files-found: error
